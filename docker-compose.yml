services:
  mock-exporter:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./mock:/app
    command: python metrics.py
    ports:
      - "9101:9101"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./mock/prometheus-mock.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - mock-exporter

  grafana:
    image: grafana/grafana:10.4.1
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./provisioning/dashboards/vast-ecosystem-capacity.json:/var/lib/grafana/dashboards/vast-ecosystem-capacity.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
